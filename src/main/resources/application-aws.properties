# Profile "aws": tuned for EC2 t2.micro (1 GiB RAM) when app runs alone (DB on RDS / external Postgres).
# Run with: SPRING_PROFILES_ACTIVE=aws (and set DATABASE_URL or JDBC env as for production).
spring.jpa.show-sql=false
logging.level.root=WARN
logging.level.com.yourname.authservice=INFO
# Small pool to leave headroom for JVM + OS on 1 GB hosts
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAXIMUM_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=${HIKARI_MINIMUM_IDLE:1}
# Fewer Tomcat threads reduces native heap pressure on tiny instances
server.tomcat.threads.max=40
server.tomcat.threads.min-spare=2
